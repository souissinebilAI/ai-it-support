Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - lblName:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =20
            Text: ="Name:"
            X: =54
            Y: =186
      - lblEmail:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =20
            Text: ="Email:"
            X: =54
            Y: =240
      - lblPriority:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =20
            Text: |-
              ="Priority:
              "
            X: =54
            Y: =293
      - lblProblem:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =20
            Text: ="Problem:"
            X: =54
            Y: =357
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(9, 33, 98, 1)
            Fill: =RGBA(232, 244, 217, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =65
            Size: =30
            Text: ="AI IT Support"
            Width: =321
            X: =523
            Y: =17
      - txtName:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Enter your name"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Size: =18
            X: =204
            Y: =186
      - txtEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            HintText: ="Enter your Email"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Size: =18
            X: =204
            Y: =240
      - txtProblem:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            Font: =Font.'Open Sans'
            Height: =168
            HintText: ="Describe your Problem..."
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Mode: =TextMode.MultiLine
            Size: =19
            Width: =653
            X: =204
            Y: =348
      - btnSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 0.9)
            Font: =Font.'Open Sans'
            Height: =47
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            Italic: =true
            OnSelect: |-
              =If(
                  IsBlank(txtName.Text),
                  Notify(
                      "Bitte Namen eingeben.",
                      NotificationType.Error
                  ),

                  IsBlank(txtEmail.Text),
                  Notify(
                      "Bitte E-Mail eingeben.",
                      NotificationType.Error
                  ),

                  IsBlank(txtProblem.Text),
                  Notify(
                      "Bitte Problem beschreiben.",
                      NotificationType.Error
                  ),

                  IsBlank(
                      LookUp(
                          Mitarbeiters,
                          'E-Mail' = txtEmail.Text
                      )
                  ),
                  Notify(
                      "Kein Mitarbeiter mit dieser E-Mail-Adresse gefunden.",
                      NotificationType.Error
                  ),

                  IfError(
                      Patch(
                          'IT-Tickets',
                          Defaults('IT-Tickets'),
                          {
                              Titel: "IT Support Anfrage",

                              Problem: txtProblem.Text,

                              Priority: Switch(
                                  ddPriority.Selected.Value,
                                  "Low", 'Priority (IT-Tickets)'.Low,
                                  "Medium", 'Priority (IT-Tickets)'.Medium,
                                  "High", 'Priority (IT-Tickets)'.High,
                                  "Critical", 'Priority (IT-Tickets)'.Critical
                              ),

                              Mitarbeiter: LookUp(
                                  Mitarbeiters,
                                  'E-Mail' = txtEmail.Text
                              )
                          }
                      );

                      Reset(txtName);
                      Reset(txtEmail);
                      Reset(ddPriority);
                      Reset(txtProblem);

                      Notify(
                          "IT-Ticket wurde erfolgreich erstellt.",
                          NotificationType.Success
                      ),

                      Notify(
                          "Fehler beim Erstellen des IT-Tickets.",
                          NotificationType.Error
                      )
                  )
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =18
            Text: ="Send inquiry"
            Width: =270
            X: =549
            Y: =584
      - ddPriority:
          Control: Classic/DropDown@2.3.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            Default: =varAIRecommendedPriority
            Font: =Font.'Open Sans'
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: |+
              =["Low", "Medium", "High", "Critical"]
            Items.Value: =Value
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Size: =18
            Tooltip: =
            Width: =320
            X: =204
            Y: =293
      - btnAIAnalyze:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =38
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(
                  varAIResponse,
                  AI_IT_Support_Analyze.Run(
                      txtProblem.Text,
                      txtEmail.Text
                  )
              );
              Set(
                  varAIRecommendedPriority,
                  Trim(
                      First(
                          Split(
                              Last(
                                  Split(
                                      varAIResponse.airesponse,
                                      "Recommended priority:"
                                  )
                              ).Value,
                              Char(10)
                          )
                      ).Value
                  )
              );
              Set(
                  varShowAI,
                  true
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: |-
              ="🤖 Analyze with AI"
            Width: =215
            X: =576
            Y: =650
      - conAIChat:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(203, 213, 225, 1)
            BorderThickness: =1
            Fill: =RGBA(248, 250, 252, 1)
            Height: =550
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Visible: =varShowAI
            Width: =550
            X: =600
            Y: =100
          Children:
            - conAIHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =50
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =Parent.Width
                Children:
                  - lblAIHeader:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =50
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =20
                        Text: |-
                          ="🤖 AI Support Analysis"
                        Width: =400
                  - btnCloseAI:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =AlignInContainer.End
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(56, 96, 178, 1)
                        Font: =Font.'Open Sans'
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =Set(
                              varShowAI,
                              false
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="X"
                        Width: |
                          =40
            - lblAIResponse:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(30, 41, 59, 1)
                  Font: =Font.'Open Sans'
                  Height: =220
                  Size: =15
                  Text: |-
                    =Substitute(
                        varAIResponse.airesponse,
                        "\n",
                        Char(10)
                    )
                  Width: =530
